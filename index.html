<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company HQ World Map</title>
    
    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1> Global Company Headquarters</h1>
                <p>Explore companies around the world. Click on bubbles to keep details visible.</p>
            </div>
            
            <div class="header-controls">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search companies, cities, countries...">
                <button id="refreshBtn" class="refresh-btn" title="Refresh data">🔄 Refresh</button>
            </div>
        </header>
        
        <div id="map" class="map-container"></div>
        
        <div class="info-panel">
            <p> Tip: Hover to preview, click to keep visible. Use the search bar to find companies!</p>
        </div>
    </div>

    <!-- Leaflet.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <!-- Application Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
